version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lm-orders-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=P@ssw0rd!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  mongodb:
    image: mongo:7.0
    container_name: lm-orders-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: lm-orders-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: lm-orders-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  lm-orders-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lm-orders-api
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Sql=Server=sqlserver,1433;Database=OrdersDb;User Id=sa;Password=P@ssw0rd!;TrustServerCertificate=True
      - ConnectionStrings__Mongo=mongodb://mongodb:27017
      - ConnectionStrings__Redis=redis:6379
      - RabbitHost=rabbitmq
    depends_on:
      - sqlserver
      - mongodb
      - redis
      - rabbitmq

volumes:
  sqlserver_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
